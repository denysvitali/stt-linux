[package]
name = "sttd"
description = "The stt-linux dictation daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "sttd"
path = "src/main.rs"

[features]
default = []
# Forwarded to stt-core so `cargo install --features cuda` reaches the engine.
openvino = ["stt-core/openvino"]
webgpu = ["stt-core/webgpu"]
cuda = ["stt-core/cuda"]

[dependencies]
stt-core.workspace = true
stt-ipc.workspace = true
stt-inject.workspace = true
stt-activate.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
signal-hook = "0.4.4"
stt-overlay = { version = "0.1.0", path = "../stt-overlay" }

[dev-dependencies]
tempfile = "3.27.0"
