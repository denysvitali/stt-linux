[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dvitali/stt-linux"
rust-version = "1.85"

[workspace.dependencies]
stt-core = { path = "crates/stt-core", version = "0.1.0" }
stt-ipc = { path = "crates/stt-ipc", version = "0.1.0" }
stt-inject = { path = "crates/stt-inject", version = "0.1.0" }
stt-activate = { path = "crates/stt-activate", version = "0.1.0" }

anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6.0"
wayland-client = "0.31"
# Defaults give us async-io + blocking-api; the probe path uses the blocking API.
zbus = "5.18"
regex = "1.13"
cpal = "0.18"
hound = "3.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
