name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        # openssl-sys (via ort-sys/ureq) needs libssl-dev; cpal needs the
        # ALSA headers. wl-clipboard gives the inject tests the binary
        # paths they probe for.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libssl-dev pkg-config libasound2-dev wl-clipboard
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep partially-built artifacts even when a job fails, so
          # iteration on a red build does not start from scratch.
          cache-on-failure: true
      - name: Run clippy
        run: |
          set -o pipefail
          cargo clippy --all-targets --locked 2>&1 | tee /tmp/clippy.log
      - name: Run tests
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee /tmp/test.log
      # The runner's own logs need a sign-in to read; surfacing the error
      # lines as check annotations makes them visible through the public
      # API (and to anyone browsing the commit).
      - name: Surface failures as annotations
        if: failure()
        run: |
          for log in /tmp/clippy.log /tmp/test.log; do
            [ -f "$log" ] || continue
            grep -E '^(error|warning|thread|FAILED|---|.*: [0-9]+:)' "$log" \
              | head -10 | while IFS= read -r line; do
                echo "::error::${line:0:480}"
              done
          done

  screenshots:
    # Renders two frames of the overlay (listening + live transcript) into
    # PNGs using the same paint and text paths the live surface uses, so the
    # README always shows real pixels of the current code. The first version
    # of this job ran the demo under headless sway and captured with grim,
    # but Ubuntu 24.04's apt sway (1.9) predates --headless, and building
    # sway 1.12 from source was a 5-min detour. The overlay is a small
    # piece of software rendering, so we just render it directly.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install fonts
        # The screenshot example calls TextRenderer::from_system, which
        # needs a real font on the runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - name: Render the overlay frames
        run: |
          set -o pipefail
          cargo run --locked -p stt-overlay --example screenshot 2>&1 \
            | tee /tmp/screenshot.log
      - name: Surface failures as annotations
        if: failure()
        run: |
          tail -c 4800 /tmp/screenshot.log | grep -E '^(error|warning|thread)' \
            | head -10 | while IFS= read -r line; do
              echo "::error::${line:0:480}"
            done
      - name: Commit refreshed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/overlay-*.png
          if git diff --cached --quiet; then
            echo "screenshots unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "ci: refresh overlay screenshots [skip ci]"
          git push
