name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        # openssl-sys (via ort-sys/ureq) needs libssl-dev; cpal needs the
        # ALSA headers. The runner image ships some of this, but pinning it
        # here keeps the job working when the image changes.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libssl-dev pkg-config libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep partially-built artifacts even when a job fails, so
          # iteration on a red build does not start from scratch.
          cache-on-failure: true
      - name: Run clippy
        run: |
          set -o pipefail
          cargo clippy --all-targets --locked 2>&1 | tee /tmp/clippy.log
      - name: Run tests
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee /tmp/test.log
      # The runner's own logs need a sign-in to read; surfacing the error
      # lines as check annotations makes them visible through the public
      # API (and to anyone browsing the commit).
      - name: Surface failures as annotations
        if: failure()
        run: |
          for log in /tmp/clippy.log /tmp/test.log; do
            [ -f "$log" ] || continue
            grep -E '^error|^ *--> ' "$log" | head -10 | while IFS= read -r line; do
              echo "::error::${line:0:480}"
            done
          done

  screenshots:
    # Renders the overlay demo under a headless wlroots compositor and
    # captures frames with grim, so the README shows real pixels that stay
    # current. Only pushes to master, since it commits its output.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install compositor and screenshot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            sway grim fonts-dejavu-core
      - name: Build the overlay demo
        run: cargo build --release --locked -p stt-overlay --example demo
      - name: Capture the demo under headless sway
        run: |
          set -o pipefail
          .github/scripts/capture-screenshots.sh 2>&1 | tee /tmp/capture.log
      # Same sign-in problem as the test job: push the interesting lines out
      # as annotations.
      - name: Surface failures as annotations
        if: failure()
        run: |
          n=0
          while IFS= read -r chunk; do
            n=$((n+1)); [ $n -gt 10 ] && break
            echo "::error::${chunk//$'\n'/%0A}"
          done < <(tail -c 4800 /tmp/capture.log | fold -w 480)
      - name: Commit refreshed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/overlay-*.png
          if git diff --cached --quiet; then
            echo "screenshots unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "ci: refresh overlay screenshots [skip ci]"
          git push
